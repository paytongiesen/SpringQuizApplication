<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Take Quiz</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<h1>Quiz</h1>

<div th:if="${#lists.isEmpty(questions)}">
    <p>No quizzes are available yet.</p>
</div>

<div th:unless="${#lists.isEmpty(questions)}">
    <form
            th:action="@{/submit}"
            method="post">

        <input type="hidden"
            th:name="${_csrf.parameterName}"
            th:value="${_csrf.token}"/>

        <div
                th:each="question : ${questions}">

            <h3 th:text="${question.questionText}">
                Question
            </h3>

            <div
                    th:each="option : ${question.options}">

                <label>

                    <input
                            type="radio"
                            th:name="${'question_' + question.id}"
                            th:value="${option}">

                    <span th:text="${option}">
                        Option
                    </span>

                </label>

                <br>

            </div>

            <hr>

        </div>

        <button type="submit">
            Submit Quiz
        </button>

    </form>
</div>

<br>

<form th:action="@{/logout}" method="post">
    <button type="submit">Logout</button>
</form>

</body>
</html>
