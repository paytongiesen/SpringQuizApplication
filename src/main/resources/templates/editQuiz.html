<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Quiz</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<h1>Edit Quiz Question</h1>

<form
        th:action="@{/editQuiz}"
        th:object="${question}"
        method="post">

    <input type="hidden"
           name="_method"
           value="put"/>

    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}"/>

    <input type="hidden"
           th:field="*{id}">

    <div>

        <label>Question</label><br>

        <textarea
                th:field="*{questionText}"
                rows="4"
                cols="60"></textarea>

    </div>

    <br>

    <label>Option A</label><br>
    <input type="text"
           th:field="*{options[0]}">

    <br><br>

    <label>Option B</label><br>
    <input type="text"
           th:field="*{options[1]}">

    <br><br>

    <label>Option C</label><br>
    <input type="text"
           th:field="*{options[2]}">

    <br><br>

    <label>Option D</label><br>
    <input type="text"
           th:field="*{options[3]}">

    <br><br>

    <label>Correct Answer</label><br>

    <select th:field="*{correctAnswer}">

        <option th:value="${question.options[0]}">
            Option A
        </option>

        <option th:value="${question.options[1]}">
            Option B
        </option>

        <option th:value="${question.options[2]}">
            Option C
        </option>

        <option th:value="${question.options[3]}">
            Option D
        </option>

    </select>

    <br><br>

    <button type="submit">
        Update Question
    </button>

</form>

<br>

<a th:href="@{/quizList}">
    Cancel
</a>

</body>
</html>
